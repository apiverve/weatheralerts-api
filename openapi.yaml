openapi: 3.0.4
info:
  title: Weather Alerts
  description: >-
    Weather Alerts returns the severe weather warnings, watches and advisories
    in effect right now for any point or state in the United States, straight
    from the National Weather Service. Each alert names the event, how severe
    and urgent it is, the area covered, when it starts and ends, and what to do.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/weatheralerts:
    get:
      summary: Weather Alerts
      description: >-
        Get the severe weather alerts in effect right now for a US point or
        state
      operationId: weatheralerts
      parameters:
        - name: lat
          in: query
          schema:
            type: number
          required: false
          description: Latitude of the location to check. Send with lon
          example: 38.627
        - name: lon
          in: query
          schema:
            type: number
          required: false
          description: Longitude of the location to check. Send with lat
          example: -90.1994
        - name: state
          in: query
          schema:
            type: string
          required: false
          description: >-
            Two-letter US state or territory code (e.g., MO) for every alert in
            effect across it. Used when lat and lon are not sent
          example: TX
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  location:
                    state: TX
                  count: 2
                  highestSeverity: Severe
                  alerts:
                    - id: urn:oid:2.49.0.1.840.0.f9aca49ebcd46d4148ecadc4f42f00d6fee04ca6.001.1
                      event: Flood Warning
                      headline: >-
                        Flood Warning issued October 2 at 1:51PM CDT until
                        October 3 at 2:51AM CDT by NWS Fort Worth TX
                      summary: FLOOD WARNING NOW IN EFFECT UNTIL LATE TONIGHT
                      severity: Severe
                      urgency: Immediate
                      certainty: Observed
                      response: Avoid
                      messageType: Update
                      area: Dallas, TX
                      issuedBy: NWS Fort Worth TX
                      sent: '2026-10-02T13:51:00-05:00'
                      onset: '2026-10-02T13:51:00-05:00'
                      expires: '2026-10-03T03:00:00-05:00'
                      ends: '2026-10-03T02:51:00-05:00'
                      description: >-
                        ...The Flood Warning continues for the following rivers
                        in Texas...


                        Trinity River At Dallas affecting Dallas County.


                        * WHAT...Minor flooding is occurring and minor flooding
                        is forecast.


                        * WHERE...Trinity River at Dallas.


                        * WHEN...Until late tonight.


                        * IMPACTS...At 30.0 feet, Minor lowland flooding will
                        begin, and

                        trails along the river begin to flood.


                        * ADDITIONAL DETAILS...

                        - At 1:30 PM CDT Friday the stage was 30.9 feet.

                        - Forecast...The river is expected to fall below flood
                        stage this

                        afternoon and continue falling to 12.7 feet early
                        Wednesday

                        afternoon.

                        - Bankfull stage is 30.0 feet.

                        - Flood stage is 30.0 feet.
                      instruction: >-
                        Do not drive cars through flooded areas. Caution is
                        urged when

                        walking near riverbanks.


                        Additional information is available at
                        water.noaa.gov/wfo/fwd.
                      geometry:
                        type: Polygon
                        coordinates:
                          - - - -96.93
                              - 32.75
                            - - -96.93
                              - 32.81
                            - - -96.83
                              - 32.83
                            - - -96.71
                              - 32.75
                            - - -96.76
                              - 32.69
                            - - -96.87
                              - 32.78
                            - - -96.93
                              - 32.75
                    - id: urn:oid:2.49.0.1.840.0.b7cdd851a493afa58b5cf5fc13948ba8a35d2b25.001.1
                      event: Flood Watch
                      headline: >-
                        Flood Watch issued October 2 at 1:36AM CDT until October
                        2 at 7:00PM CDT by NWS Corpus Christi TX
                      summary: FLOOD WATCH REMAINS IN EFFECT THROUGH THIS EVENING
                      severity: Severe
                      urgency: Future
                      certainty: Possible
                      response: Prepare
                      messageType: Update
                      area: >-
                        La Salle; McMullen; Live Oak; Bee; Goliad; Victoria;
                        Webb; Duval; Jim Wells; Inland Kleberg; Inland Nueces;
                        Inland San Patricio
                      issuedBy: NWS Corpus Christi TX
                      sent: '2026-10-02T01:36:00-05:00'
                      onset: '2026-10-02T01:36:00-05:00'
                      expires: '2026-10-02T19:00:00-05:00'
                      ends: '2026-10-02T19:00:00-05:00'
                      description: >-
                        * WHAT...Flooding caused by excessive rainfall continues
                        to be

                        possible.


                        * WHERE...A portion of south Texas, including the
                        following areas,

                        Bee, Duval, Goliad, Inland Kleberg, Inland Nueces,
                        Inland San

                        Patricio, Jim Wells, La Salle, Live Oak, McMullen,
                        Victoria and

                        Webb.


                        * WHEN...Through this evening.


                        * IMPACTS...Excessive runoff may result in flooding of
                        rivers,

                        creeks, streams, and other low-lying and flood-prone
                        locations.

                        Flooding may occur in poor drainage and urban areas.


                        * ADDITIONAL DETAILS...

                        - Flooding caused by excessive rainfall is possible.
                        Additional

                        rainfall totals of 1-3 inches with isolated higher
                        amounts will

                        fall over areas that have already seen 2-4" of rain
                        within the

                        watch area.

                        - http://www.weather.gov/safety/flood
                      instruction: >-
                        You should monitor later forecasts and be alert for
                        possible Flood

                        Warnings. Those living in areas prone to flooding should
                        be prepared

                        to take action should flooding develop.
                      geometry: null
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
